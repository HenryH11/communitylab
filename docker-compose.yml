services:
  communitylab-app:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: localhost/communitylab-frontend:latest
    container_name: communitylab-app
    ports:
      - "8501:8501"
    depends_on:
      communitylab-ingestor:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - COMMUNITYLAB_PROVEEDOR_ANALISIS=${COMMUNITYLAB_PROVEEDOR_ANALISIS:-nvidia_nim}
      - COMMUNITYLAB_PROVEEDOR_GENERACION=${COMMUNITYLAB_PROVEEDOR_GENERACION:-nvidia_nim}
      - COMMUNITYLAB_MODELO_GEMINI=${COMMUNITYLAB_MODELO_GEMINI:-gemini-3.5-flash-lite}
      - COMMUNITYLAB_NVIDIA_TIMEOUT_SEGUNDOS=${COMMUNITYLAB_NVIDIA_TIMEOUT_SEGUNDOS:-15.0}
      - COMMUNITYLAB_MODELO_NVIDIA_INTERPRETACION=${COMMUNITYLAB_MODELO_NVIDIA_INTERPRETACION:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      - COMMUNITYLAB_MODELO_NVIDIA=${COMMUNITYLAB_MODELO_NVIDIA:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - COMMUNITYLAB_ENRUTAMIENTO_ADAPTATIVO=${COMMUNITYLAB_ENRUTAMIENTO_ADAPTATIVO:-true}
      - COMMUNITYLAB_MODELO_NVIDIA_RAPIDO=${COMMUNITYLAB_MODELO_NVIDIA_RAPIDO:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - COMMUNITYLAB_MODELO_NVIDIA_ESTANDAR=${COMMUNITYLAB_MODELO_NVIDIA_ESTANDAR:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - COMMUNITYLAB_MODELO_NVIDIA_RAZONAMIENTO=${COMMUNITYLAB_MODELO_NVIDIA_RAZONAMIENTO:-nvidia/nemotron-3-super-120b-a12b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      # Endpoint interno hacia el contenedor de ingesta
      - INGESTOR_URL=${INGESTOR_URL:-http://communitylab-ingestor:8000/sincronizar}
      # Credenciales estrictas de SOLO LECTURA
      - DB_READ_USER=${DB_READ_USER:-ro_query_communitylab}
      - DB_READ_DSN=${DB_READ_DSN}
      - DB_READ_PASSWORD_SECRET_OCID=${DB_READ_PASSWORD_SECRET_OCID}
    volumes:
      # Hereda el directorio preparado para UID 1000 en la imagen.
      - communitylab-salida:/app/salida
    networks:
      - communitylab-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  communitylab-ingestor:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: localhost/communitylab-backend:latest
    container_name: communitylab-ingestor
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Credenciales estrictas de ESCRITURA (aisladas del frontend)
      - DB_USER=${DB_USER:-rw_ingest_communitylab}
      - DB_DSN=${DB_DSN}
      - DB_PASSWORD_SECRET_OCID=${DB_PASSWORD_SECRET_OCID}
    networks:
      - communitylab-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  communitylab-interno:
    profiles: ["interno"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "src/app/app_interna.py"]
    ports:
      - "127.0.0.1:8502:8501"
    env_file:
      - path: .env.interno
        required: true
    volumes:
      - communitylab-interno-salida:/app/salida
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  communitylab-salida:

networks:
  communitylab-internal:
    driver: bridge
