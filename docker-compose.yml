services:
  communitylab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: communitylab-app
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - COMMUNITYLAB_PROVEEDOR_ANALISIS=${COMMUNITYLAB_PROVEEDOR_ANALISIS:-nvidia_nim}
      - COMMUNITYLAB_PROVEEDOR_GENERACION=${COMMUNITYLAB_PROVEEDOR_GENERACION:-nvidia_nim}
      - COMMUNITYLAB_MODELO_NVIDIA=${COMMUNITYLAB_MODELO_NVIDIA:-google/gemma-4-31b-it}
      - COMMUNITYLAB_ENRUTAMIENTO_ADAPTATIVO=${COMMUNITYLAB_ENRUTAMIENTO_ADAPTATIVO:-true}
      - COMMUNITYLAB_MODELO_NVIDIA_RAPIDO=${COMMUNITYLAB_MODELO_NVIDIA_RAPIDO:-meta/llama-3.1-8b-instruct}
      - COMMUNITYLAB_MODELO_NVIDIA_ESTANDAR=${COMMUNITYLAB_MODELO_NVIDIA_ESTANDAR:-google/gemma-4-31b-it}
      - COMMUNITYLAB_MODELO_NVIDIA_RAZONAMIENTO=${COMMUNITYLAB_MODELO_NVIDIA_RAZONAMIENTO:-meta/llama-3.3-70b-instruct}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    volumes:
      # Persistencia de informes, ciclos y logs fuera del contenedor
      - ./salida:/app/salida
      # Montaje de lectura para poder actualizar configuración en caliente
      - ./configuracion:/app/configuracion:ro
    restart: unless-stopped
